  <rect width="820" height="420" fill="#F7F5EF"/>
  <path d="M20,330 L160,310 L260,190 L330,110 L450,100 L540,150 L640,270 L800,300 L800,380 L20,380 Z" fill="#D8C8A8" stroke="#31594D" stroke-width="2"/>
